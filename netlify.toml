[build]
  command = "pnpm build"
  publish = ".next"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/get-value-estimate"
  to = "/asset-value-estimate"
  status = 301
  force = true

[[redirects]]
  from = "/get-value-estimate/"
  to = "/asset-value-estimate/"
  status = 301
  force = true

